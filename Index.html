<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Atividades – Prof. Amilton</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
body {
    font-family: 'Roboto', sans-serif;
    background: #fffbe6;
    margin: 0;
    padding: 0;
}
header {
    background: linear-gradient(90deg, #ff8a65, #ffb74d);
    color: white;
    padding: 25px;
    text-align: center;
    font-size: 2em;
    font-weight: bold;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
}
.container {
    padding: 20px;
    max-width: 1000px;
    margin: auto;
}
.segmento {
    margin-bottom: 30px;
    border-radius: 12px;
    padding: 15px;
}
.segmento h1 {
    cursor: pointer;
    text-align: center;
    color: white;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 10px;
    font-size: 1.5em;
}

/* Série cores e ocultas por padrão */
.serie {
    display: none; /* séries escondidas por padrão */
    margin-bottom: 15px;
    border-radius: 12px;
    padding: 10px;
    transition: transform 0.3s;
}
.serie h2 {
    margin: 0;
    cursor: pointer;
    padding: 10px;
    border-radius: 8px;
    color: white;
    text-align: center;
    transition: background 0.3s;
}
.disciplinas {
    margin-top: 10px;
    display: none; /* disciplinas escondidas por padrão */
}
.disciplina {
    margin-bottom: 10px;
    display: flex;
    align-items: center;
}
.disciplina i {
    margin-right: 10px;
    font-size: 1.2em;
}
.disciplina button {
    flex: 1;
    background: #4dd0e1;
    border: none;
    padding: 12px;
    font-size: 1.05em;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
}
.disciplina button:hover {
    background: #26c6da;
    transform: scale(1.03);
}
.formularios {
    margin-top: 5px;
    display: none; /* formulários escondidos por padrão */
    padding-left: 30px;
    animation: fadeIn 0.5s ease-in-out;
}
.formularios a {
    display: block;
    margin: 5px 0;
    text-decoration: none;
    color: #00695c;
    font-weight: bold;
    transition: color 0.2s, transform 0.2s;
}
.formularios a:hover {
    color: #004d40;
    transform: translateX(5px);
    text-decoration: underline;
}

/* Segmentos cores */
#ensinoMedio h1 { background: #42a5f5; }
#proEJA h1 { background: #66bb6a; }
#eja h1 { background: #ff7043; }

/* Série cores */
.ensinoMedio { background: #90caf9; }
.proEJA { background: #a5d6a7; }
.eja { background: #ffab91; }

@keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<header>Portal de Atividades – Prof. Amilton</header>

<div class="container">

<!-- ENSINO MÉDIO -->
<div class="segmento" id="ensinoMedio">
    <h1 onclick="toggleSeries(this)">Ensino Médio</h1>

    <!-- 1º Ano -->
    <div class="serie ensinoMedio">
        <h2 onclick="toggleDisciplinas(this)">1º Ano</h2>
        <div class="disciplinas">
            <div class="disciplina">
                <i class="fas fa-book-open"></i>
                <button onclick="toggleFormularios(this)">Língua e Cultura</button>
                <div class="formularios">
                    <a href="#" target="_blank">Formulário 1</a>
                </div>
            </div>
        </div>
    </div>

    <!-- 2º Ano -->
    <div class="serie ensinoMedio">
        <h2 onclick="toggleDisciplinas(this)">2º Ano</h2>
        <div class="disciplinas">
            <div class="disciplina">
                <i class="fas fa-flask"></i>
                <button onclick="toggleFormularios(this)">Iniciação Científica</button>
                <div class="formularios">
                    <a href="#" target="_blank">Formulário 1</a>
                </div>
            </div>
        </div>
    </div>

    <!-- 3º Ano -->
    <div class="serie ensinoMedio">
        <h2 onclick="toggleDisciplinas(this)">3º Ano</h2>
        <div class="disciplinas">
            <div class="disciplina">
                <i class="fas fa-landmark"></i>
                <button onclick="toggleFormularios(this)">Cultura e Patrimônio</button>
                <div class="formularios">
                    <a href="#" target="_blank">Formulário 1</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ProEJA -->
<div class="segmento" id="proEJA">
    <h1 onclick="toggleSeries(this)">ProEJA</h1>

    <!-- Logística II -->
    <div class="serie proEJA">
        <h2 onclick="toggleDisciplinas(this)">Logística II</h2>
        <div class="disciplinas">
            <div class="disciplina">
                <i class="fas fa-book"></i>
                <button onclick="toggleFormularios(this)">Português</button>
                <div class="formularios">
                    <a href="#" target="_blank">Formulário 1</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Logística IV -->
    <div class="serie proEJA">
        <h2 onclick="toggleDisciplinas(this)">Logística IV</h2>
        <div class="disciplinas">
            <div class="disciplina">
                <i class="fas fa-book"></i>
                <button onclick="toggleFormularios(this)">Português</button>
                <div class="formularios">
                    <a href="#" target="_blank">Formulário 1</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- EJA -->
<div class="segmento" id="eja">
    <h1 onclick="toggleSeries(this)">EJA</h1>

    <!-- TF VII -->
    <div class="serie eja">
        <h2 onclick="toggleDisciplinas(this)">TF VII</h2>
        <div class="disciplinas">
            <div class="disciplina">
                <i class="fas fa-book"></i>
                <button onclick="toggleFormularios(this)">Português</button>
                <div class="formularios">
                    <a href="#" target="_blank">Formulário 1</a>
                </div>
            </div>
        </div>
    </div>
</div>

</div>

<script>
function toggleSeries(header) {
    const segmento = header.parentElement;
    const series = segmento.querySelectorAll('.serie');
    series.forEach(s => s.style.display = s.style.display === "block" ? "none" : "block");
}

function toggleDisciplinas(header) {
    const disciplinas = header.nextElementSibling;
    disciplinas.style.display = disciplinas.style.display === "block" ? "none" : "block";
}

function toggleFormularios(button) {
    const formularios = button.nextElementSibling;
    formularios.style.display = formularios.style.display === "block" ? "none" : "block";
}
</script>

</body>
</html>
